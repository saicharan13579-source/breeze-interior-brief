<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BREEZE — Interior Brief</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F2F5F3;--bg2:#E3EBE8;--card:#FBFCFB;--ink:#1C2B28;--body:#45574F;--muted:#6A7A74;--line:#D5E0DC;--bronze:#2F6E9A;--gold:#8FC3E6;--dark:#1F3A30;--ok:#4E6B3A;--warn:#9A4E36;--blue:#3E5A7A;
--hf:'Cormorant Garamond',Georgia,serif;--tf:'DM Sans',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--tf);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 32px}
/* header */
header{position:sticky;top:0;z-index:30;background:rgba(242,245,243,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:24px;height:64px}
.brand{font-family:var(--hf);font-size:26px;font-weight:600;letter-spacing:4px;white-space:nowrap;text-decoration:none}
.brand span{font-family:var(--tf);font-size:12px;letter-spacing:2px;color:var(--bronze);font-weight:500;margin-left:10px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
nav::-webkit-scrollbar{display:none}
nav a{padding:8px 11px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:500;color:var(--body);white-space:nowrap}
nav a:hover{background:var(--bg2)}
nav a.on{background:var(--ink);color:var(--bg)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#A6B6B0}
.dot.live{background:#5E8A44}
/* type */
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--bronze);font-weight:600}
h1,h2,h3{font-family:var(--hf);font-weight:500;line-height:1.08}
h1{font-size:clamp(44px,6vw,80px)}
h2{font-size:clamp(32px,4vw,48px)}
h3{font-size:26px;font-weight:600}
p.lead{font-size:18px;color:var(--body);max-width:720px}
section.block{padding:56px 0;border-top:1px solid var(--line)}
section.block:first-of-type{border-top:none}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;transition:.15s}
.btn:hover,.btn.on{background:var(--ink);color:var(--bg)}
.btn.sm{padding:6px 12px;font-size:13px}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--bg2);font-size:13px;color:var(--body)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;letter-spacing:1.5px;font-weight:600;text-transform:uppercase}
.badge.ex{background:#D7E8F4;color:var(--bronze)}
.badge.nw{background:var(--ink);color:var(--bg)}
/* overview */
.hero{position:relative;border-radius:14px;overflow:hidden;margin-top:32px;aspect-ratio:21/9;min-height:360px;background:#2a3a20}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .cap{position:absolute;inset:auto 0 0 0;padding:120px 40px 40px;background:linear-gradient(rgba(15,28,23,0),rgba(15,28,23,.78) 45%,rgba(15,28,23,.92));color:#F2F5F3;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.hero .cap .eyebrow{color:var(--gold)}
.hero .cap p{color:#E1EAE6;max-width:640px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.stat b{display:block;font-family:var(--hf);font-size:44px;font-weight:500;line-height:1}
.stat span{font-size:13px;color:var(--muted)}
.flats{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-top:28px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;text-decoration:none;transition:.2s}
.fcard:hover{border-color:var(--bronze);transform:translateY(-2px);box-shadow:0 10px 30px rgba(28,43,40,.08)}
.fcard .top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.fcard .sz{font-family:var(--hf);font-size:52px;line-height:1}
.fcard .sz small{font-family:var(--tf);font-size:14px;color:var(--bronze);margin-left:6px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.thumbs figure img{aspect-ratio:4/3;object-fit:cover;border-radius:8px}
.thumbs figcaption{font-size:13px;font-weight:500;margin-top:6px;line-height:1.3}
.prog{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.swrow{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:24px}
.sw{display:flex;flex-direction:column;gap:8px}
.sw .c{aspect-ratio:3/2;border-radius:8px;border:1px solid var(--line)}
.sw img{aspect-ratio:1;object-fit:cover;border-radius:8px}
.sw b{font-size:14px;font-weight:600}.sw span{font-size:13px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:24px}
.step{border-top:2px solid var(--bronze);padding-top:16px}
.step b{font-family:var(--hf);font-size:40px;color:var(--bronze);font-weight:500;display:block;line-height:1}
/* flat */
.fhead{display:grid;grid-template-columns:1fr;gap:48px;padding:48px 0 32px;align-items:end}
.fhead .sz{font-family:var(--hf);font-size:clamp(64px,9vw,120px);line-height:.9}
.fhead .sz small{font-size:.35em;color:var(--bronze)}
.dims{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.dims div{display:flex;justify-content:space-between;gap:12px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.dims div span{color:var(--muted);text-align:right}
.stabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:stretch}
.stab{text-decoration:none;color:inherit;display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;transition:.15s}
.stab img{width:84px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.stab:hover{border-color:var(--bronze)}
.stab.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stab b{display:block;font-family:var(--hf);font-size:21px;font-weight:600;line-height:1.1;margin:3px 0}
.stab small{font-size:12px;color:var(--muted)}
.cmpbtn{border-radius:12px;padding:0 22px;min-height:84px}
.shead{display:flex;justify-content:space-between;gap:32px;align-items:flex-end;padding:40px 0 20px;flex-wrap:wrap}
.subnav{display:flex;gap:6px;position:sticky;top:64px;z-index:20;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.subnav a{font-size:14px;font-weight:500;padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--body)}
.subnav a:hover{background:var(--bg2)}
.kw{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.collage{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:24px}
.collage .side{display:grid;grid-template-rows:1fr 1fr;gap:12px}
.collage img{width:100%;height:100%;object-fit:cover;border-radius:10px;cursor:zoom-in;transition:.2s}
.collage img:hover{filter:brightness(1.05)}
.collage .main{aspect-ratio:16/10}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.refs figure{margin:0;cursor:zoom-in}.refs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}
.refs figcaption{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.35}.refs figcaption a{color:inherit}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px}
.scard{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;transition:.2s}
.scard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.scard .im{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:16/10}
.scard .im img{width:100%;height:100%;object-fit:cover;display:block}.scard .im img:first-child{grid-row:1/3}
.scard .in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.scard small{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}.scard b{font-size:17px}
.scard .pp{display:flex;gap:3px}.scard .pp i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
.sbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}.sbar button.on{background:var(--ink);color:#fff}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:12px}
.swatches figure{cursor:zoom-in}
.swatches img{aspect-ratio:4/3;object-fit:cover;border-radius:8px}
.swatches figcaption{font-size:13px;margin-top:6px;font-weight:500}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px}
.pc{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);text-align:left;padding:0;transition:.15s}
.pc:hover{transform:translateY(-2px)}
.pc i{display:block;height:72px}
.pc div{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.pc div span{color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
.spec{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.spec i{width:14px;flex:none}
.spec div{padding:14px 16px}
.spec small{font-size:11px;letter-spacing:2px;color:var(--bronze);font-weight:600}
.spec b{display:block;font-size:16px;margin:2px 0}
.spec p{font-size:14px;color:var(--body)}
.spec .hx{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);margin-top:4px}
.brief{display:grid;grid-template-columns:280px 1fr;gap:32px;margin-top:24px}
.lpanel{background:var(--dark);color:#F2F5F3;border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:20px;align-self:start;position:sticky;top:130px}
.lpanel small{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:600;display:block;margin-bottom:4px}
.lpanel p{font-size:16px;line-height:1.4}
.lpanel .av{color:#E8B4A0}
.rooms{display:flex;flex-direction:column}
.room{display:grid;grid-template-columns:150px 170px 1fr 150px;gap:16px;padding:18px 0;border-top:1px solid var(--line);align-items:start}
.room b{font-size:16px;display:block}
.room .dm{font-size:13px;color:var(--bronze)}
.room p{color:var(--body);font-size:15px}
.rgal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-content:start}.rgal .m{grid-column:1/-1}.rgal figcaption{grid-column:1/-1;font-size:10.5px;color:var(--muted);line-height:1.3}
.room figure{margin:0;cursor:zoom-in}.room figure img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
.room figcaption{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.3}.room figcaption a{color:inherit}
.room code{font-size:11px;color:var(--muted);display:block;margin-top:6px;word-break:break-all}
select.st{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500}
.st[data-s=model]{border-color:#8FC3E6;background:#E8F2F9}
.st[data-s=render]{border-color:#8BA3BE;background:#E8EEF4}
.st[data-s=review]{border-color:#2F6E9A;background:#E4F0F8}
.st[data-s=changes]{border-color:#C07A62;background:#F6E3DC}
.st[data-s=done]{border-color:#7E9B6A;background:#E6EEDD}
.exnote{font-size:13px;color:var(--muted);background:var(--bg2);border-radius:8px;padding:8px 10px}
.pn{display:flex;justify-content:space-between;gap:16px;padding:40px 0 64px}
/* compare */
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin:28px 0 64px}
.ccol{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ccol img{aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}
.ccol .in{padding:20px;display:flex;flex-direction:column;gap:14px}
.ccol .pp{display:flex;height:28px;border-radius:6px;overflow:hidden}
.ccol .pp i{flex:1}
.ccol dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.ccol dt{color:var(--bronze);font-weight:600;letter-spacing:1px;font-size:11px;padding-top:2px}
/* standards */
.stds{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px}
.stds div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.stds b{font-size:12px;letter-spacing:2px;color:var(--bronze)}
.stds p{margin-top:8px;color:var(--body)}
.gen{background:var(--dark);color:#F2F5F3;border-radius:14px;padding:28px;margin-top:24px;display:grid;grid-template-columns:repeat(4,1fr) auto;gap:14px;align-items:end}
.gen label{font-size:12px;letter-spacing:1.5px;color:var(--gold);display:flex;flex-direction:column;gap:6px}
.gen select,.gen input{background:#2A4A3E;border:1px solid #45574F;border-radius:8px;padding:10px;color:#F2F5F3}
.gen .out{grid-column:1/-1;display:flex;gap:12px;align-items:center;background:#2A4A3E;border-radius:8px;padding:14px 16px;font-family:ui-monospace,Menlo,monospace;font-size:16px}
.gen .out span{flex:1;word-break:break-all}
.gen .btn{border-color:#F2F5F3;color:#F2F5F3}
.gen .btn:hover{background:#F2F5F3;color:var(--ink)}
/* tracker */
.tbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:24px}
.tbar select,.tbar input{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:14px}
.tsum{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}
.tsum>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.tsum b{font-family:var(--hf);font-size:30px;font-weight:500}
.tsum span{font-size:13px;color:var(--muted);display:block;margin-bottom:8px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.tgroup{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tgroup h4{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:var(--bg2);font-size:15px}
.tgroup h4 a{font-size:13px;font-weight:500;color:var(--bronze)}
.trow{display:grid;grid-template-columns:150px 1fr 190px 1.3fr 130px;gap:14px;padding:12px 20px;border-top:1px solid var(--line);align-items:center;font-size:14px}
.trow code{font-size:12px;color:var(--muted);word-break:break-all}
.trow input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px}
.trow .when{font-size:12px;color:var(--muted)}
.empty{padding:28px 20px;color:var(--muted)}
/* lightbox / toast */
.lb{position:fixed;inset:0;background:rgba(15,28,23,.94);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px}
.lb.open{display:flex}
.lb img{max-height:82vh;max-width:92vw;border-radius:8px;object-fit:contain}
.lb p{color:#E1EAE6;font-size:14px}
.lb button{position:absolute;background:rgba(242,245,243,.12);border:none;color:#F2F5F3;width:48px;height:48px;border-radius:50%;font-size:22px}
.lb .x{top:20px;right:20px}.lb .pv{left:20px;top:50%}.lb .nx{right:20px;top:50%}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:110;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
footer{padding:40px 0;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:24px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}
.tile{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/10;text-decoration:none;color:#F2F5F3;display:block;background:#1C2B28}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.tile:hover img{transform:scale(1.05)}
.tile span{position:absolute;inset:auto 0 0 0;padding:18px 20px;background:linear-gradient(transparent,rgba(15,28,23,.85));font-family:var(--hf);font-size:28px}
.tile small{display:block;font-family:var(--tf);font-size:12px;letter-spacing:1px;color:#E1EAE6}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:20px}
.plans figure{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in}
.plans img{aspect-ratio:16/9;object-fit:cover;width:100%}
.plans figcaption{padding:12px 16px;font-size:14px;font-weight:500}
.tbl{width:100%;border-collapse:collapse;margin-top:20px;background:var(--card);border-radius:12px;overflow:hidden;font-size:14px}
.tbl th{text-align:left;background:var(--bg2);padding:10px 14px;font-size:12px;letter-spacing:1.5px;color:var(--bronze)}
.tbl td{padding:10px 14px;border-top:1px solid var(--line)}
.tbl tr.ref td{background:#E6F0F7;font-weight:600}
.tours{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.tour{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-size:14px;font-weight:500}
.tour.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.tour:hover{opacity:.85}
.tip{background:#E4F0F8;border-left:4px solid var(--bronze);border-radius:8px;padding:14px 18px;margin-top:20px;font-size:14px;color:var(--body)}
.tip b{color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.list{columns:2;column-gap:32px;margin-top:16px}
.list li{list-style:none;break-inside:avoid;padding:8px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:12px;font-size:15px}
.list li span{color:var(--muted);white-space:nowrap}
.cat{display:grid;grid-template-columns:160px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line);font-size:15px}
.cat b{color:var(--bronze);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding-top:3px}
.floors{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px;margin-top:24px}
.floor{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.floor img{aspect-ratio:16/10;object-fit:cover;width:100%;cursor:zoom-in}
.floor>div{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.floor .tours{margin-top:0}
.floor .tour{padding:7px 12px;font-size:13px}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 20px;margin-top:20px;font-size:14px}
.lgrid div{border-bottom:1px dashed var(--line);padding:6px 0}
.lgrid i{font-style:normal;color:var(--bronze);font-weight:600;margin-right:8px}
@media (max-width:980px){.tiles,.two{grid-template-columns:1fr}.list{columns:1}.lgrid{grid-template-columns:1fr 1fr}.floors{grid-template-columns:1fr}}

.map{display:grid;grid-template-columns:1fr 380px;gap:20px;margin-top:32px;align-items:start}
.mapbox{position:relative;border-radius:14px;overflow:hidden;background:#2a3a20;box-shadow:0 20px 50px rgba(28,43,40,.18)}
.mapbox img{width:100%;height:auto;display:block;transition:filter .3s}

const TASKS=[];

let T=LS.get('breeze-tracker',{});  // id -> {status,note,by,at}
let mode='local', db=null, col=null, readOnly=false;
const queue={};
function stat(id){return (T[id]&&T[id].status)||'todo'}
function save(id,patch){
  const prev=T[id]||{};
  const rec={status:prev.status||'todo',note:prev.note||'',...patch,by:LS.get('breeze-name','')||'',at:new Date().toISOString()};
  T[id]=rec; LS.set('breeze-tracker',T);
  if(mode==='live'&&col&&!readOnly){
    queue[id]=(queue[id]||Promise.resolve()).then(()=>col.doc(id).set(rec)).catch(e=>{
      if(e&&e.code==='invalid_argument'){readOnly=true;setSync();toast('You have view-only access — changes are not shared')}
      else if(e&&e.code==='quota_exceeded'){toast('Tracker storage is full')}
      else {toast('Could not save — will keep it on this device')}
    });
  }
  refreshStatus();
}
function setSync(txt){
  const el=$('#sync');
  if(mode==='live'&&!readOnly) el.innerHTML='<i class="dot live"></i><span>Tracker live · shared</span>';
  else if(mode==='live') el.innerHTML='<i class="dot"></i><span>View only</span>';
  else el.innerHTML='<i class="dot"></i><span>'+(txt||'Saved on this device')+'</span>';
}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use){setSync();return}
    db=await window.claude.use('db');
    if(!db){setSync();return}
    col=db.collection('renders');
    let got=false;
    const timer=setTimeout(()=>{if(!got) setSync('Tracker offline — saving on this device')},10000);
    col.onSnapshot(snap=>{
      got=true; clearTimeout(timer); mode='live'; setSync();
      const next={...T};
      snap.docs.forEach(d=>{const v=d.data(); if(v) next[d.id]={...v}});
      T=next; LS.set('breeze-tracker',T); refreshStatus();
    },err=>{clearTimeout(timer);mode='local';setSync('Tracker offline — saving on this device')});
    try{const u=await window.claude.use('user'); if(u&&u.can){const w=await u.can('data.write'); if(w===false){readOnly=true;setSync()}}}catch(e){}
  }catch(e){setSync()}
}

let SS='size';
function styleCards(){

  if(SS==='facing') L.sort((a,b)=>fo.indexOf(a.t.facing)-fo.indexOf(b.t.facing)||a.z.s-b.z.s);
  if(SS==='status') L.sort((a,b)=>(!!b.t.exist)-(!!a.t.exist)||a.z.s-b.z.s);
  if(SS==='tower') L.sort((a,b)=>Object.keys(a.t.units).join().localeCompare(Object.keys(b.t.units).join())||a.z.s-b.z.s);

   <div class="in"><small>${String(i+1).padStart(2,'0')} · ${z.lab} sq ft · Type-${t.n} · ${t.facing}</small><b>${esc(t.name)}</b>

function whenTxt(r){if(!r||!r.at) return '—';const d=new Date(r.at);if(isNaN(d)) return '—';return (r.by?esc(r.by)+' · ':'')+d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
function report(){
  const lines=['BREEZE render status — '+new Date().toLocaleString()];
  D.sizes.forEach(z=>{const p=progress(t=>t.s===z.s);lines.push('',`${z.lab} sq ft — ${p.d}/${p.n} approved`);TASKS.filter(t=>t.s===z.s).forEach(t=>{const r=T[t.id]||{};lines.push(`  Type-${t.n} ${t.style} · ${t.room}: ${STL[stat(t.id)]}${r.note?' — '+r.note:''}`)})});
  return lines.join('\n');
}

function refreshStatus(){
  document.querySelectorAll('select.st').forEach(s=>{if(document.activeElement===s) return;const v=stat(s.dataset.id);s.value=v;s.dataset.s=v});
  document.querySelectorAll('[data-when]').forEach(e=>e.innerHTML=whenTxt(T[e.dataset.when]));
  document.querySelectorAll('input[data-note]').forEach(i=>{if(document.activeElement!==i) i.value=(T[i.dataset.note]||{}).note||''});
  const all=progress(),cnt=k=>TASKS.filter(t=>stat(t.id)===k).length;
  const set=(k,v)=>document.querySelectorAll(`[data-live="${k}"]`).forEach(e=>e.textContent=v);
  set('pct',all.p+'%');set('done',all.d);set('started',TASKS.filter(t=>stat(t.id)!=='todo').length);set('wip',cnt('model')+cnt('render'));set('rev',cnt('review'));set('chg',cnt('changes'));
  document.querySelectorAll('[data-live="ab"]').forEach(e=>e.style.width=all.p+'%');
  D.sizes.forEach(z=>{const p=progress(t=>t.s===z.s);set('fp-'+z.s,`${p.d}/${p.n} approved`);document.querySelectorAll(`[data-live="fb-${z.s}"]`).forEach(e=>e.style.width=p.p+'%')});

}

    <div class="rv"><div class="eyebrow">The project</div><h2 style="margin:10px 0 18px">Calm white terraces,<br>warm lit interiors.</h2><p>Flowing white balcony bands and glass rails define BREEZE from the outside. Inside, every flat type gets a distinct mood — from Japandi calm to velvet jewel tones — so the 3D renders show buyers 16 genuinely different homes.</p><p style="font-size:15px;color:var(--muted);margin-top:16px">Drag the image to compare day and night.</p></div>
    <div class="cmpw rv" id="cmpw"><img src="${im('hero/day')}" alt="Day"><img class="nt" src="${im('hero/night')}" alt="Night"><span class="lb" style="left:14px">Day</span><span class="lb" style="right:14px">Night</span><div class="hd"><i>⇆</i></div></div>
  </div></section>
  <section class="lsec"><div class="wrap"><div class="lhead"><div><div class="eyebrow">Choose a flat</div><h2>Four flat sizes</h2></div><a class="btn" href="#f1695" style="text-decoration:none">Start with 1,695 sq ft →</a></div>
   <div class="lsizes">${D.sizes.map((z,zi)=>{const p=progress(t=>t.s===z.s);return `<a class="lsize rv" style="transition-delay:${zi*.08}s" href="#f${z.s}"><div class="pl"><img loading="lazy" src="${im(z.styles[0].pimg)}" alt="${z.lab} sq ft plan"></div><div class="tx"><div class="n">${z.lab}<small>sq ft</small></div><div class="ts">${z.styles.length} unit types · ${X.wings.filter(w=>w.s===z.s).length} flats per floor<br>${z.styles.map(t=>esc(t.name)).join(' · ')}</div><div class="prog" style="margin-top:6px"><i style="width:${p.p}%"></i></div><div class="ts">${p.d}/${p.n} renders approved</div></div></a>`}).join('')}</div></div></section>
  <section class="lsec" id="lstyles"><div class="wrap"><div class="lhead"><div><div class="eyebrow">Interior themes</div><h2>16 unit types, 16 styles</h2></div>
   <div class="lfilter"><button data-lf="all" class="${LF==='all'?'on':''}">All</button>${D.sizes.map(z=>`<button data-lf="${z.s}" class="${LF===z.s?'on':''}">${z.lab}</button>`).join('')}</div></div>
   <div class="lstyles" id="lstylesg">${landStyles()}</div></div></section>
  <section class="lsec"><div class="wrap"><div class="lhead"><div><div class="eyebrow">Site · top view</div><h2>Find a flat on the site</h2></div></div>${mapHTML()}</div></section>
  <section class="lsec" style="border-bottom:none"><div class="wrap">
   <div class="steps rv" style="margin-bottom:56px">
    <div class="step"><b>01</b><h3>Pick a type</h3><p>Open a flat size, then the unit type you are rendering — each has its own theme.</p></div>
    <div class="step"><b>02</b><h3>Model to the brief</h3><p>Mood board, materials, lighting and a reference photo for every room are on the type page.</p></div>
    <div class="step"><b>03</b><h3>Update your status</h3><p>Set each room's status as you work. Everyone sees it live in the Tracker.</p></div></div>
   <div class="lcta rv"><div><div class="eyebrow" style="color:var(--gold)">For the 3D team</div><h2>Ready to start?</h2><p>Walk through the full brief as a presentation, or check the rendering standards and file names first.</p></div>
    <div class="cta"><button class="cbtn pri" data-present="cover" style="justify-content:center">▶ Present the full brief</button><a class="cbtn" href="#standards" style="justify-content:center">Rendering standards</a><a class="cbtn" href="#tracker" style="justify-content:center">Open the render tracker</a></div></div>
  </div></section>`;
}
const sm=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)};
function heroTick(){
  const w=$('#lscroll');if(!w)return;
  const r=w.getBoundingClientRect();const tot=w.offsetHeight-(innerHeight-64);const p=Math.max(0,Math.min(1,(64-r.top)/tot));
  const n=sm(.12,.72,p);
  $('#hnight').style.opacity=n;
  $('#hlayer').style.transform=`translateY(${p*-2}%) scale(${1.06-p*.06})`;
  $('#hglow').style.opacity=sm(.45,.9,p);const cl=$('#hclouds');cl.style.opacity=1-n*.55;cl.style.filter=`brightness(${1-n*.6}) saturate(${1-n*.4})`;cl.style.transform=`translateY(${-p*40}px)`;$('#hstars').style.opacity=sm(.55,.95,p)*.8;
  const inn=$('#lhero .in');inn.style.opacity=1-sm(.02,.3,p);inn.style.transform=`translateY(${-p*120}px)`;
  const ev=$('#heve');ev.style.opacity=sm(.6,.85,p)*(1-sm(.96,1,p)*.0);ev.style.transform=`translateY(${(1-sm(.6,.85,p))*30}px)`;
  $('#hhint').style.opacity=1-sm(0,.08,p);
  const min=10.5*60+Math.round(n*9*60);const hh=Math.floor(min/60),mm=min%60;$('#htime').textContent=`${((hh+11)%12)+1}:${String(mm-mm%5).padStart(2,'0')} ${hh>=12?'PM':'AM'}`;
  $('#horb').style.transform=`translateX(${(1-n)*100}%)`;
  document.querySelectorAll('[data-dn]').forEach(b=>b.classList.toggle('on',(b.dataset.dn==='night')===(n>.5)));
}
let heroRaf=0;window.addEventListener('scroll',()=>{if(!heroRaf)heroRaf=requestAnimationFrame(()=>{heroRaf=0;heroTick()})},{passive:true});window.addEventListener('resize',heroTick);
function initLanding(){
  const h=$('#lhero');if(!h)return;
  heroTick();
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.rv').forEach(el=>io.observe(el));
  const c=$('#cmpw');if(c){const nt=c.querySelector('.nt'),hd=c.querySelector('.hd');let drag=false;
    const set=x=>{const r=c.getBoundingClientRect();const p=Math.max(0,Math.min(100,(x-r.left)/r.width*100));nt.style.clipPath=`inset(0 0 0 ${p}%)`;hd.style.left=p+'%'};
    c.addEventListener('pointerdown',e=>{drag=true;c.setPointerCapture(e.pointerId);set(e.clientX)});c.addEventListener('pointermove',e=>{if(drag)set(e.clientX)});c.addEventListener('pointerup',()=>drag=false)}
}
document.addEventListener('click',e=>{
  const d=e.target.closest('[data-dn]');if(d){const w=$('#lscroll');const tot=w.offsetHeight-(innerHeight-64);const top=w.getBoundingClientRect().top+scrollY-64;window.scrollTo({top:top+(d.dataset.dn==='night'?tot*.8:0),behavior:'smooth'});return}
  const f=e.target.closest('[data-lf]');if(f){LF=f.dataset.lf;document.querySelectorAll('[data-lf]').forEach(b=>b.classList.toggle('on',b===f));$('#lstylesg').innerHTML=landStyles();document.querySelectorAll('#lstylesg .rv').forEach(x=>x.classList.add('in'));return}
  const j=e.target.closest('[data-jumpid]');if(j){e.preventDefault();const t=document.getElementById(j.dataset.jumpid);if(t)window.scrollTo({top:t.getBoundingClientRect().top+scrollY-64,behavior:'smooth'})}
});

/* ---------- router ---------- */
function route(){return (location.hash||'#overview').slice(1)||'overview'}
function render(){
  const r=route(); if(r.startsWith('present')){const k=r.slice(8);if(!$('#pv').classList.contains('open'))presOpen(k);else{const j=PS.list.findIndex(s=>s.key===k);if(j>=0&&j!==PS.i)presShow(j)}return} nav(r); let html='';
  const m=r.match(/^f(\d{4})(?:-(s\d|compare))?$/);
  const W=WIDE();
  if(m){const z=D.sizes.find(z=>z.s===m[1]); if(z){const cmp=m[2]==='compare';html=W&&!cmp?(m[2]?pType(z,+m[2][1]):pSize(z)):vFlat(z,cmp?1:(m[2]?+m[2][1]:1),cmp)}}
  else if(r==='standards') html=W?pStandards():vStandards();
  else if(r==='styles') html=W?pStyles():vStyles();
  else if(r==='amenities') html=vAmenities();
  else if(r==='tracker') html=vTracker();
  const isLand=!html; if(!html){html=vLanding();}
  $('#main').innerHTML=html+`<footer><div class="wrap">BREEZE in the Courtyard · interior brief & project guide for the 3D team · room sizes to be verified against CAD.</div></footer>`;
  window.scrollTo(0,0); fitFrames(); if(isLand) initLanding();
  if(r==='standards'){['gS','gT','gR','gC'].forEach(i=>$('#'+i).addEventListener('input',genUpdate));genUpdate();$('#gCopy').onclick=()=>copy($('#gO').textContent,'File name copied')}
  if(r==='tracker'){
    $('#tName').addEventListener('change',e=>{LS.set('breeze-name',e.target.value.trim());toast('Name saved')});
    $('#tFlat').onchange=e=>{tf.flat=e.target.value;$('#tlist').innerHTML=trackerList()};
    $('#tStat').onchange=e=>{tf.status=e.target.value;$('#tlist').innerHTML=trackerList()};
    $('#tQ').oninput=e=>{tf.q=e.target.value;$('#tlist').innerHTML=trackerList()};
    $('#tCopy').onclick=()=>copy(report(),'Status report copied');
  }
}
window.addEventListener('hashchange',render);
let lastW=WIDE();window.addEventListener('resize',()=>{fitFrames();if(WIDE()!==lastW){lastW=WIDE();render()}});

/* ---------- events ---------- */
document.addEventListener('change',e=>{
  const s=e.target.closest('select.st'); if(s){ if(readOnly){toast('View-only access');s.value=stat(s.dataset.id);return} s.dataset.s=s.value; save(s.dataset.id,{status:s.value}); toast(STL[s.value]); }
  const n=e.target.closest('input[data-note]'); if(n){ if((T[n.dataset.note]||{}).note!==n.value) save(n.dataset.note,{note:n.value.trim()}); }
});
document.addEventListener('keydown',e=>{const n=e.target.closest&&e.target.closest('input[data-note]');if(n&&e.key==='Enter'){n.blur()}});
document.addEventListener('click',e=>{
  if(e.target.closest('[data-stop]')) return;
  const pr=e.target.closest('[data-present]'); if(pr){presOpen(pr.dataset.present);return}
  if(!e.target.closest('#pv')){const pg=e.target.closest('.sframe [data-pgo]');if(pg){const r=keyRoute(pg.dataset.pgo);if(r){location.hash=r;return}}
   const zm=e.target.closest('.sframe [data-zoom]');if(zm){if(zm.dataset.zg&&GAL[zm.dataset.zg]){LB.items=GAL[zm.dataset.zg];LB.i=+zm.dataset.zi}else{LB.items=[[zm.dataset.zoom,zm.dataset.cap||'']];LB.i=0}showLb();$('#lb').classList.add('open');return}}
  const wg=e.target.closest('[data-wing]'); if(wg){mapWing=+wg.dataset.wing; mapSel=X.wings[mapWing].t; refreshMap(); return}
  const tw=e.target.closest('[data-tower]'); if(tw){mapSel=tw.dataset.tower||null; mapWing=null; if(mapSel==='C'||mapSel==='A'||mapSel==='B'){} refreshMap(); return}
  const ms=e.target.closest('[data-msize]'); if(ms){mapSize=ms.dataset.msize||null; refreshMap(); return}
  const st=e.target.closest('[data-step]'); if(st){const d=LS.get('breeze-start',{}); d[st.dataset.step]=!d[st.dataset.step]; LS.set('breeze-start',d); const s=document.getElementById('start'); if(s) s.outerHTML=startHTML(); return}
  const c=e.target.closest('[data-copy]'); if(c){copy(c.dataset.copy,c.dataset.copy+' copied');return}
  const j=e.target.closest('[data-jump]'); if(j){e.preventDefault();const t=document.getElementById(j.dataset.jump);if(t) window.scrollTo({top:t.getBoundingClientRect().top+scrollY-120,behavior:'smooth'});return}
  const cs=e.target.closest('[data-copyspec]'); if(cs){const t=findStyle(cs.dataset.copyspec);copy([t.name+' — material schedule',...t.spec.map(x=>`${x[0]}: ${x[1]} — ${x[2]} (${x[3]})`),'','Palette: '+t.pal.map(p=>p[0]+' '+p[1]).join(', ')].join('\n'),'Schedule copied');return}
  const l=e.target.closest('[data-lb]'); if(l){openLb(l.dataset.lb,+l.dataset.i);return}
  const g=e.target.closest('[data-gal]'); if(g){LB.items=GAL[g.dataset.gal];LB.i=+g.dataset.i;showLb();$('#lb').classList.add('open')}
});
function findStyle(id){for(const z of D.sizes)for(const t of z.styles)if(t.id===id)return t}

/* wing hover card */
document.addEventListener('mouseover',e=>{const w=e.target.closest&&e.target.closest('[data-wing]');const c=document.getElementById('wcard');if(!c)return;
  if(!w){c.style.display='none';return}
  const d=X.wings[+w.dataset.wing];c.innerHTML=wingCard(d);c.style.display='block';
  const box=document.getElementById('mapbox').getBoundingClientRect(),r=w.getBoundingClientRect();
  let x=r.right-box.left+8,y=r.top-box.top; if(x+190>box.width) x=r.left-box.left-190; c.style.left=x+'px'; c.style.top=Math.max(8,y)+'px'});
/* lightbox */
let LB={items:[],i:0};
function openLb(id,i){const t=findStyle(id);LB.items=[[t.hero,t.name],...t.sides.map(k=>[k,t.name+' · detail']),...t.sw.map(([k,n])=>[k,n])];LB.i=i;showLb();$('#lb').classList.add('open')}
function showLb(){const [k,c]=LB.items[LB.i];$('#lb img').src=im(k);$('#lb img').alt=c;$('#lb p').textContent=`${c}  ·  ${LB.i+1} / ${LB.items.length}`}
function step(d){LB.i=(LB.i+d+LB.items.length)%LB.items.length;showLb()}
$('#lb .x').onclick=()=>$('#lb').classList.remove('open');
$('#lb .pv').onclick=()=>step(-1);$('#lb .nx').onclick=()=>step(1);
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')$('#lb').classList.remove('open')});
document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('open'))return;if(e.key==='Escape')$('#lb').classList.remove('open');if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});

render(); setSync('Saved on this device'); initDb();
</script>
</body>
